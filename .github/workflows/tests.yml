# Tests on every pull request: the real page in a real browser, at phone size.
# A pull request is merged once this is green. Nothing is uploaded anywhere; GitHub Pages
# publishes main by itself after the merge.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: The game in a real browser
    runs-on: ubuntu-24.04   # Playwright cannot install its browser on ubuntu-latest (26.04) yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the test browser
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run the tests
        working-directory: tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: tests/test-results
